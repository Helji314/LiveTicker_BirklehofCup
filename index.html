<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Birklehof Cup Live Ticker">
  <title>Birklehof Cup Live Ticker</title>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <img src="https://media.licdn.com/dms/image/v2/D4E0BAQEO_-Pd2TrHVQ/company-logo_200_200/company-logo_200_200/0/1700679450215/birklehof_logo?e=2147483647&v=beta&t=GW_D1dG36TjEQWJRj9UhmpqMN_spmmmbJDW_Qf_oJtI" alt="Birklehof Logo">
      </div>
      <h1>Birklehof Cup</h1>
      <p class="competition-info" aria-live="polite" id="competition-status">Wird geladen...</p>
    </header>

    <section class="countdown-section" aria-live="polite" aria-atomic="true">
      <h2>Countdown zum Start</h2>
      <div class="countdown-display" id="main-countdown">-- : -- : --</div>
    </section>

    <nav class="sport-nav" role="tablist" aria-label="Sportarten">
      <button class="sport-btn active active-accent" data-sport="all" role="tab" aria-selected="true">Alle</button>
      <button class="sport-btn" data-sport="Badminton" role="tab" aria-selected="false">Badminton</button>
      <button class="sport-btn" data-sport="Basketball" role="tab" aria-selected="false">Basketball</button>
      <button class="sport-btn" data-sport="Volleyball" role="tab" aria-selected="false">Volleyball</button>
      <button class="sport-btn" data-sport="Hockey" role="tab" aria-selected="false">Hockey</button>
      <button class="sport-btn" data-sport="Fußball" role="tab" aria-selected="false">Fußball</button>
      <button class="sport-btn" data-sport="Gesamtwertung" role="tab" aria-selected="false">Gesamtwertung</button>
    </nav>

    <main role="main">
      <div id="content">
        <div class="loading">Wird geladen...</div>
      </div>
    </main>
  </div>

  <script>
    const COMPETITION_START = new Date('2026-05-09T14:45:00+02:00');
    const DATA_URL = './schedule.json';
    let scheduleData = null;
    let currentSport = 'all';

    // Initialize
    async function init() {
      try {
        const response = await fetch(DATA_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        scheduleData = await response.json();
        
        setupEventListeners();
        updateAllTimers();
        setInterval(updateAllTimers, 1000);
      } catch (err) {
        console.error('Error loading schedule:', err);
        document.getElementById('content').innerHTML = `
          <div class="empty-state">
            <p>❌ Fehler beim Laden der Zeitplan-Daten.</p>
            <p>Bitte überprüfen Sie, dass <code>schedule.json</code> vorhanden ist.</p>
          </div>
        `;
      }
    }

    function setupEventListeners() {
      document.querySelectorAll('.sport-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.sport-btn').forEach(b => {
            b.classList.remove('active', 'active-accent');
            b.setAttribute('aria-selected', 'false');
          });
          btn.classList.add('active');
          if (btn.dataset.sport === 'all' || btn.dataset.sport === 'Gesamtwertung') {
            btn.classList.add('active-accent');
          }
          btn.setAttribute('aria-selected', 'true');
          currentSport = btn.dataset.sport;
          render();
        });
      });
    }

    function updateAllTimers() {
      updateMainCountdown();
      render();
    }

    function updateMainCountdown() {
      const now = new Date();
      const diff = COMPETITION_START - now;
      const display = formatCountdown(diff);
      document.getElementById('main-countdown').textContent = display;

      // Update competition status
      const status = document.getElementById('competition-status');
      if (diff > 0) {
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        status.textContent = `Beginnt in ${days} Tagen`;
      } else {
        status.textContent = 'Event läuft';
      }
    }

    function formatCountdown(ms) {
      if (ms <= 0) return '00 : 00 : 00';
      const hours = Math.floor((ms % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((ms % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((ms % (1000 * 60)) / 1000);
      return `${String(hours).padStart(2, '0')} : ${String(minutes).padStart(2, '0')} : ${String(seconds).padStart(2, '0')}`;
    }

    function getNextMatch() {
      if (!scheduleData || !scheduleData.matches) return null;
      const now = new Date();
      return scheduleData.matches.find(m => new Date(m.scheduledStart) > now) || null;
    }

    function getMatchesBySport(sport) {
      if (!scheduleData || !scheduleData.matches) return [];
      if (sport === 'all') return scheduleData.matches;
      return scheduleData.matches.filter(m => m.sport === sport);
    }

    function getMatchStatus(match) {
      const now = new Date();
      const start = new Date(match.scheduledStart);
      const end = new Date(match.scheduledEnd);
      if (now < start) return 'scheduled';
      if (now >= start && now < end) return 'ongoing';
      return 'finished';
    }

    function renderNextMatch() {
      const next = getNextMatch();
      if (!next) return '';

      const startTime = new Date(next.scheduledStart);
      const now = new Date();
      const diff = startTime - now;
      const countdown = formatCountdown(diff);

      return `
        <div class="next-match">
          <h3>Nächstes Match</h3>
          <div class="next-match-sport">${next.sport} ${next.category ? '- ' + next.category : ''}</div>
          <div class="next-match-time">${startTime.toLocaleString('de-DE', { 
            weekday: 'short', 
            month: 'short', 
            day: 'numeric',
            hour: '2-digit', 
            minute: '2-digit' 
          })}</div>
          <div class="next-match-countdown" aria-live="polite">${countdown}</div>
        </div>
      `;
    }

    function renderMatches(sport) {
      const matches = getMatchesBySport(sport);
      if (matches.length === 0) {
        return '<div class="empty-state"><p>Keine Matches für diese Sportart.</p></div>';
      }

      return matches.map(match => {
        const status = getMatchStatus(match);
        const startTime = new Date(match.scheduledStart);
        const statusLabel = {
          scheduled: 'Geplant',
          ongoing: 'Läuft',
          finished: 'Beendet'
        }[status];

        return `
          <div class="match">
            <div class="match-header">
              <div>
                <div class="match-sport">${match.sport}${match.category ? ' - ' + match.category : ''}</div>
                <div style="font-size: 0.85rem; color: #999;">Runde ${match.round}</div>
              </div>
              <span class="match-status status-${status}">${statusLabel}</span>
            </div>
            <div class="match-time">${startTime.toLocaleString('de-DE', {
              weekday: 'short',
              month: 'short',
              day: 'numeric',
              hour: '2-digit',
              minute: '2-digit'
            })}</div>
            <div class="match-results">
              ${scheduleData.schools.map(school => `
                <div class="school-result">
                  <div class="school-name">${school}</div>
                  <div class="school-score ${match.results[school] === null ? 'empty' : ''}">
                    ${match.results[school] !== null ? match.results[school] : '—'}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderGesamtwertung() {
      if (!scheduleData) return '';
      const sorted = Object.entries(scheduleData.gesamtwertung)
        .sort(([, a], [, b]) => b - a);

      return `
        <div class="standings">
          <div class="standings-row header">
            <div>Schule</div>
            <div style="text-align: right;">Punkte</div>
          </div>
          ${sorted.map(([school, points]) => `
            <div class="standings-row">
              <div class="standings-school">${school}</div>
              <div class="standings-points">${points}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function render() {
      const contentDiv = document.getElementById('content');

      if (!scheduleData) {
        contentDiv.innerHTML = '<div class="loading">Wird geladen...</div>';
        return;
      }

      if (currentSport === 'Gesamtwertung') {
        contentDiv.innerHTML = renderGesamtwertung();
      } else {
        let html = renderNextMatch();
        html += renderMatches(currentSport);
        contentDiv.innerHTML = html || '<div class="empty-state"><p>Keine Daten verfügbar.</p></div>';
      }
    }

    // Start the app
    init();
  </script>
</body>
</html>
